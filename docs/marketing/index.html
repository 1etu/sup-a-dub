<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Sup-a-Dub: rubber ducks, bubble rescues, and a shared endless pool. Game screenshots and brand artwork."
    />
    <title>Sup-a-Dub · Screenshots &amp; press kit</title>
    <link rel="icon" href="brand/supadub-avatar-192.png" />
    <style>
      :root {
        font-family: 'Trebuchet MS', Arial, sans-serif;
        color: #effaff;
        background: #155486;
        font-synthesis: none;
        --lime: #cefa86;
        --pink: #ffb5dc;
        --muted: #c8e8f8;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: 24px;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 94% 0, #63cee843, transparent 38rem),
          linear-gradient(#b9f1ff12 1px, transparent 1px),
          linear-gradient(90deg, #b9f1ff12 1px, transparent 1px),
          linear-gradient(160deg, #164877, #176194 50%, #103c6b);
        background-size:
          auto,
          28px 28px,
          28px 28px,
          auto;
        min-width: 280px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 5px;
      }
      img {
        display: block;
        max-width: 100%;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
      h1,
      h2,
      h3 {
        margin: 0;
      }
      figure {
        margin: 0;
      }
      .shell {
        width: min(1160px, calc(100% - 64px));
        margin: auto;
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 104px;
      }
      .brand {
        width: 220px;
        flex: 0 1 220px;
      }
      .brand img {
        width: 100%;
        height: auto;
      }
      .nav {
        display: flex;
        gap: 24px;
        font-size: 14px;
        font-weight: 700;
      }
      .nav a {
        text-decoration: none;
        padding: 10px 0;
      }
      .nav a:hover {
        color: var(--lime);
      }
      .eyebrow {
        color: var(--lime);
        font-size: 12px;
        letter-spacing: 0.16em;
        font-weight: 800;
        text-transform: uppercase;
      }
      .page-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        margin: 14px 0 18px;
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
        color: var(--muted);
      }
      .hero {
        padding: 8px;
        border: 1px solid #e8fcff;
        border-radius: 18px;
        background: linear-gradient(#faffff, #becde2);
        box-shadow:
          0 6px 0 #bdcae3,
          0 16px 32px #05254450;
      }
      .hero img {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }
      .hero-caption {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px 24px;
        padding: 20px 4px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .hero-caption a {
        font-weight: 700;
      }
      .badges {
        overflow-x: auto;
        padding: 32px 0 4px;
        scrollbar-color: #81bad9 transparent;
      }
      .badges img {
        width: 912px;
        min-width: 640px;
        height: auto;
      }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin: 48px 0 24px;
      }
      .section-heading h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
        margin-top: 7px;
      }
      .section-heading > p {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px 24px;
      }
      .shot {
        display: block;
        overflow: hidden;
        padding: 5px;
        background: linear-gradient(#eefaff, #bfd2e9);
        border-radius: 12px;
        box-shadow:
          0 4px 0 #94b1d0,
          0 10px 18px #06305140;
        position: relative;
        text-decoration: none;
      }
      .shot img {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border-radius: 7px;
      }
      .shot::after {
        content: '↗';
        position: absolute;
        bottom: 13px;
        right: 13px;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid #d7f3ff9c;
        border-radius: 50%;
        background: #0f4269d9;
        color: #fff;
        font-size: 19px;
      }
      .shot:hover {
        background: var(--lime);
      }
      .gallery figcaption {
        display: flex;
        gap: 13px;
        padding: 18px 4px 0;
      }
      .number {
        color: var(--pink);
        font-size: 12px;
        font-weight: 800;
        padding-top: 3px;
      }
      .gallery h3 {
        font-size: 18px;
        line-height: 1.25;
      }
      .downloads {
        margin-top: 52px;
        padding-top: 1px;
        border-top: 1px solid #bdeaff50;
      }
      .downloads .section-heading {
        margin-top: 30px;
      }
      .brand-assets {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 28px;
      }
      .asset {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .wordmark-preview {
        width: 220px;
        height: 86px;
        display: flex;
        align-items: center;
      }
      .wordmark-preview img {
        width: 100%;
        height: auto;
      }
      .avatar-asset > img {
        width: 80px;
        height: 80px;
        border-radius: 15px;
      }
      .asset h3 {
        font-size: 17px;
      }
      .asset p {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .download-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .download-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #def6ff;
        border-radius: 8px;
        background: linear-gradient(#d6f5ff, #8bc6ec 49%, #63abd9 50%, #529bd0);
        box-shadow: 0 2px 0 #082d53;
        color: #0c365e;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }
      .download-links a:hover {
        background: var(--lime);
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-size: 12px;
        padding: 36px 0;
      }
      @media (max-width: 680px) {
        .shell {
          width: calc(100% - 32px);
        }
        .masthead {
          min-height: 88px;
          gap: 18px;
        }
        .brand {
          flex-basis: 158px;
        }
        .nav {
          gap: 14px;
          font-size: 12px;
        }
        .page-title {
          margin-top: 6px;
        }
        .eyebrow {
          font-size: 10px;
          letter-spacing: 0.12em;
        }
        h1 {
          font-size: 12px;
        }
        .hero {
          padding: 5px;
          border-radius: 12px;
        }
        .hero img {
          border-radius: 7px;
        }
        .hero-caption {
          font-size: 11px;
          padding-top: 18px;
        }
        .section-heading {
          display: block;
          margin-top: 36px;
        }
        .section-heading > p {
          margin-top: 9px;
          text-align: left;
        }
        .gallery {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .brand-assets {
          flex-direction: column;
          gap: 24px;
        }
        .asset {
          gap: 18px;
        }
        .wordmark-preview {
          width: 110px;
          flex-shrink: 0;
        }
        footer {
          font-size: 11px;
        }
      }
      @media (max-width: 360px) {
        .masthead {
          flex-wrap: wrap;
          gap: 0;
          padding: 18px 0;
        }
        .nav {
          width: 100%;
          margin-top: 8px;
        }
        .avatar-asset {
          align-items: start;
        }
        .avatar-asset > img {
          width: 68px;
          height: 68px;
        }
      }
    </style>
  </head>
  <body id="top">
    <header class="shell masthead">
      <a class="brand" href="#top" aria-label="Sup-a-Dub press kit home">
        <img src="brand/supadub-wordmark.svg" width="1452" height="265" alt="Sup-a-Dub" />
      </a>
      <nav class="nav" aria-label="Press kit">
        <a href="#screenshots">Screenshots</a>
        <a href="#downloads">Downloads</a>
      </nav>
    </header>
    <main class="shell">
      <div class="page-title">
        <span class="eyebrow">Sup-a-Dub</span>
        <h1>Screenshots &amp; press kit</h1>
      </div>
      <figure>
        <div class="hero">
          <img
            src="brand/supadub-hero.png"
            width="1672"
            height="941"
            alt="Sup-a-Dub promotional key art with rubber ducks."
          />
        </div>
        <figcaption class="hero-caption">
          <span>Promotional composition</span>
          <a href="brand/supadub-hero.png" download>Download artwork · PNG</a>
        </figcaption>
      </figure>
      <section id="screenshots" aria-labelledby="screenshots-title">
        <div class="section-heading">
          <div>
            <h2 id="screenshots-title">Actual game screenshots</h2>
          </div>
          <p>Select an image to open the full PNG.</p>
        </div>
        <div class="gallery">
          <figure>
            <a
              class="shot"
              href="gallery/bubble-rescue.png"
              aria-label="Open the full Bubble Rescue screenshot"
            >
              <img
                src="gallery/bubble-rescue.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="A golden duck leads a chain of ducklings toward a pink exit in a tiled tub."
              />
            </a>
            <figcaption>
              <span class="number">01</span>
              <div>
                <h3>Bubble Rescue</h3>
              </div>
            </figcaption>
          </figure>
          <figure>
            <a
              class="shot"
              href="gallery/endless-pool.png"
              aria-label="Open the full Endless Pool screenshot"
            >
              <img
                src="gallery/endless-pool.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="Rubber ducks share the pink water of the Endless Pool."
              />
            </a>
            <figcaption>
              <span class="number">02</span>
              <div>
                <h3>Endless Pool</h3>
              </div>
            </figcaption>
          </figure>
          <figure>
            <a
              class="shot"
              href="gallery/choose-your-duck.png"
              aria-label="Open the full Choose Your Duck screenshot"
            >
              <img
                src="gallery/choose-your-duck.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="The duck selection screen shows the available rubber duck appearances."
              />
            </a>
            <figcaption>
              <span class="number">03</span>
              <div>
                <h3>Choose your duck</h3>
              </div>
            </figcaption>
          </figure>
          <figure>
            <a class="shot" href="gallery/toy-box.png" aria-label="Open the full Toy Box screenshot">
              <img
                src="gallery/toy-box.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="The collection displays Deep Sea, Fiesta, Aurora, and Patchwork duck skins with their medal goals."
              />
            </a>
            <figcaption>
              <span class="number">04</span>
              <div>
                <h3>The toy box</h3>
              </div>
            </figcaption>
          </figure>
          <figure>
            <a class="shot" href="gallery/medals.png" aria-label="Open the full Medals screenshot">
              <img
                src="gallery/medals.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="The medals screen shows achievement goals and bronze, silver, and gold awards."
              />
            </a>
            <figcaption>
              <span class="number">05</span>
              <div>
                <h3>Medals</h3>
              </div>
            </figcaption>
          </figure>
          <figure>
            <a class="shot" href="gallery/main-menu.png" aria-label="Open the full Main Menu screenshot">
              <img
                src="gallery/main-menu.png"
                width="1600"
                height="900"
                loading="lazy"
                alt="The main menu uses glossy lettering over a blue tiled pool background."
              />
            </a>
            <figcaption>
              <span class="number">06</span>
              <div>
                <h3>Main menu</h3>
              </div>
            </figcaption>
          </figure>
        </div>
      </section>
      <section class="downloads" id="downloads" aria-labelledby="downloads-title">
        <div class="section-heading">
          <div>
            <h2 id="downloads-title">Downloads</h2>
          </div>
          <p>Download the logo or an avatar.</p>
        </div>
        <div class="brand-assets">
          <article class="asset">
            <div class="wordmark-preview">
              <img
                src="brand/supadub-wordmark.svg"
                width="1452"
                height="265"
                alt="Sup-a-Dub logo with blue and pink glossy lettering"
              />
            </div>
            <div>
              <h3>Wordmark</h3>
              <p>Transparent background.</p>
              <div class="download-links">
                <a href="brand/supadub-wordmark.svg" download>SVG</a
                ><a href="brand/supadub-wordmark.png" download>PNG</a>
              </div>
            </div>
          </article>
          <article class="asset avatar-asset">
            <img
              src="brand/supadub-avatar-192.png"
              width="192"
              height="192"
              alt="A yellow rubber duck avatar"
            />
            <div>
              <h3>Avatar</h3>
              <p>Square avatar.</p>
              <div class="download-links">
                <a href="brand/supadub-avatar-512.png" download>512 px PNG</a
                ><a href="brand/supadub-avatar.png" download>1024 px PNG</a
                ><a href="brand/supadub-avatar.svg" download>SVG</a>
              </div>
            </div>
          </article>
        </div>
      </section>
      <div class="badges" tabindex="0" role="region" aria-label="Project badges; scroll to see all">
        <img
          src="brand/badges.svg"
          width="912"
          height="44"
          alt="Bun 1.4, strict TypeScript, WebGL 2, and multiplayer"
        />
      </div>
    </main>
    <footer class="shell">
      <span>Sup-a-Dub</span><a href="brand/PROVENANCE.md">Artwork credits</a><a href="#top">Back to top ↑</a>
    </footer>
  </body>
</html>
